name: CI

# OPERATOR-GATED: applying branch-protection rules is a one-time operator action,
# NOT an autonomous CI job. To enforce required status checks on 'main', run the
# reference script once with admin credentials:
#
#   node core/skills/initializing-projects/references/branch-protection.mjs
#
# That script calls the GitHub API to wire the 'test' job as a required check.
# Never add a CI step that autonomously applies protection — it requires admin
# permissions that must not live in GitHub Actions secrets.

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: node --test "core/**/*.test.mjs" "modules/**/*.test.mjs" "scripts/**/*.test.mjs"
      - name: Scan for leaked secrets
        run: node core/skills/initializing-projects/references/scan-secrets-in-tree.mjs
      - name: Grep-gate — retired bash anti-forgery prose must not resurface (#475)
        run: |
          set -e
          PATTERN='anti-forgery|package_launcher|package launcher|denied_class[^"'"'"']{0,40}(targeted_vitest|package_launcher|interpreter)|interpreter workaround|forge wall|isStateForgeCommand|decideBashForge|bash forge|state-forge'
          if grep -rniE "$PATTERN" core/opencode/skills core/opencode/agents core/opencode/AGENTS.md; then
            echo "" >&2
            echo "Retired bash anti-forgery prose resurfaced above (issue #475 removed the wall — decideBashForge/isStateForgeCommand and the whole detector family). The advisory channel (allow + prose hint) survives; deny-teaching prose does not. If new prose legitimately needs one of these phrases, narrow the pattern in this step instead of reintroducing the wall's vocabulary." >&2
            exit 1
          fi
